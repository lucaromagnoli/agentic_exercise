[project]
name = "agentic-exercise"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "logfire>=5.6.0",
    "pydantic-ai-slim[anthropic,openai]>=2.68.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "ipython>=9.18.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["triage"]
